spring.application.name=crochet-store

# Database — set these as environment variables on your machine / on Render,
# never commit real credentials to git
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crochet_store}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

server.port=${PORT:8080}

app.orders.payment-expiry-minutes=${PAYMENT_EXPIRY_MINUTES:15}
app.orders.expiry-check-delay-ms=${ORDER_EXPIRY_CHECK_DELAY_MS:60000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
